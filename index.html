<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de conexão</title>
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --tx:#1b2430; --mu:#6b7684; --bd:#d9dfe7; --pr:#2f6fb5;
          --ok:#1e7e46; --err:#b3261e; --wn:#8a5a00; --run:#2f6fb5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --card:#1b222b; --tx:#e8edf3; --mu:#97a3b2; --bd:#2d3744; --pr:#6aa7e8;
            --ok:#7fd9a1; --err:#ff9d96; --wn:#ffd27a; --run:#6aa7e8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .mu { color: var(--mu); font-size: 13px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin: 16px 0; }
  button { background:var(--pr); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button.sec { background:transparent; color:var(--pr); border:1px solid var(--pr); }
  .alert { padding:10px 12px; border-radius:8px; border:1px solid var(--err); color:var(--err); margin:12px 0; }
  ol { list-style:none; margin:0; padding:0; }
  li.step { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .head { display:flex; gap:10px; align-items:baseline; }
  .sym { width:1.2em; text-align:center; font-weight:700; }
  .ok .sym { color:var(--ok); } .err .sym { color:var(--err); } .warn .sym { color:var(--wn); } .run .sym { color:var(--run); }
  .title { font-weight:600; }
  .text { color:var(--mu); font-size:13px; margin: 4px 0 0 2em; word-break: break-word; }
  .err .text { color:var(--err); }
  pre.det { margin: 8px 0 0 2em; padding:8px 10px; background:var(--bg); border:1px solid var(--bd); border-radius:8px;
            font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow:auto; }
</style>
</head>
<body>
<main>
  <h1>Tentativa e Erro</h1>
  <p class="mu">Trabalhe Corna</p>

  <div class="bar">
    <button id="btnLogin" hidden>Testa ai: Seu e-mail de CLT</button>
    <button id="btnCopy" class="sec" hidden>Copiar resultado</button>
    <button id="btnOut" class="sec" hidden>Sair</button>
  </div>

  <div id="msg" class="alert" hidden></div>
  <ol id="steps"></ol>
</main>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO  (nenhum destes valores é segredo)
   ============================================================ */
const CONFIG = {
  clientId: "aa4188a2-d57f-4506-9b47-fedcebc2f0ae",   // ID do aplicativo (Entra)
  tenantId: "c54e138a-79f5-4294-aa9b-b004cf8d7ff7",   // ID do diretório (Entra)
  siteSearch: ["PCP", "Central de Gestão Operacional", "*"], // termos para achar o site, em ordem
  listHint: "visitas",          // parte do nome da lista de visitas
  fileQuery: "Preventiva",      // termo de busca do arquivo
  fileHint: "atualiza",         // parte do nome do arquivo da base
  tableHint: "atualiza",        // parte do nome da tabela da base
  expectedListColumns: ["Title", "DataExecucao", "TecnicoResponsavel", "Situacao", "DataHoraEntrada", "DataHoraSaida", "Observacao"],
  expectedBaseColumns: ["programado/INFRATEL", "WO", "Tipo de Preventiva", "Status Compilado - Final", "Data Fim - Consolidado", "Expurgo Situação"],
  statusColumn: "Status Compilado - Final",
  otherColumnsToCount: ["Expurgo Situação"],
  dateColumn: "Data Fim - Consolidado",
  siteColumn: "programado/INFRATEL",
  woColumn: "WO"
};
const SCOPES = ["User.Read", "Sites.ReadWrite.All"];
const REDIRECT = location.origin + location.pathname;

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const $ = s => document.querySelector(s);
const norm = s => String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const report = [];
let app = null, account = null;

const STEPS = [
  ["login", "1. Login com a conta da empresa"],
  ["me",    "2. Perfil do usuário (Microsoft Graph)"],
  ["site",  "3. Site do SharePoint (PCP)"],
  ["list",  "4. Lista de visitas"],
  ["file",  "5. Arquivo da base de preventivas"],
  ["table", "6. Tabela do Excel"],
  ["data",  "7. Colunas e valores da base"]
];

function buildSteps() {
  const ol = $("#steps");
  ol.textContent = "";
  STEPS.forEach(([id, title]) => {
    const li = document.createElement("li");
    li.className = "step wait"; li.id = "s-" + id;
    const head = document.createElement("div"); head.className = "head";
    const sym = document.createElement("span"); sym.className = "sym"; sym.textContent = "·";
    const t = document.createElement("span"); t.className = "title"; t.textContent = title;
    head.append(sym, t);
    const txt = document.createElement("div"); txt.className = "text"; txt.hidden = true;
    const det = document.createElement("pre"); det.className = "det"; det.hidden = true;
    li.append(head, txt, det);
    ol.appendChild(li);
  });
}

function setStep(id, state, text, details) {
  const li = $("#s-" + id);
  li.className = "step " + state;
  li.querySelector(".sym").textContent = ({ ok: "✓", err: "✗", warn: "!", run: "…", wait: "·" })[state] || "·";
  const txt = li.querySelector(".text"), det = li.querySelector(".det");
  txt.textContent = text || ""; txt.hidden = !text;
  const d = (details || []).join("\n");
  det.textContent = d; det.hidden = !d;
  const title = STEPS.find(s => s[0] === id)[1];
  report.push((({ ok: "[OK]", err: "[ERRO]", warn: "[ATENÇÃO]", run: "[...]", wait: "[--]" })[state]) + " " + title +
              (text ? " — " + text : "") + (d ? "\n" + d.split("\n").map(l => "    " + l).join("\n") : ""));
}

function showMsg(t) { const m = $("#msg"); m.textContent = t; m.hidden = !t; }

/* ============================================================
   LOGIN E CHAMADAS AO MICROSOFT GRAPH
   ============================================================ */
async function getToken() {
  try {
    const r = await app.acquireTokenSilent({ scopes: SCOPES, account });
    return r.accessToken;
  } catch (e) {
    if (e && e.name === "InteractionRequiredAuthError") {
      await app.acquireTokenRedirect({ scopes: SCOPES, account });
      return new Promise(() => {}); // a página será redirecionada
    }
    throw e;
  }
}

async function graph(path) {
  const token = await getToken();
  const res = await fetch("https://graph.microsoft.com/v1.0" + path, {
    headers: { Authorization: "Bearer " + token, Accept: "application/json" }
  });
  if (!res.ok) {
    let m = "";
    try { const j = await res.json(); m = (j.error && j.error.message) || ""; } catch (_) {}
    const err = new Error("HTTP " + res.status + (m ? " – " + m : ""));
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* ============================================================
   OS TESTES
   ============================================================ */
const ctx = {};

async function runStep(id, fn) {
  setStep(id, "run", "Verificando…");
  report.pop();                       // não registra o estado intermediário
  try { await fn(); return true; }
  catch (e) { setStep(id, "err", e.message || String(e)); return false; }
}

async function testMe() {
  const me = await graph("/me?$select=displayName,mail,userPrincipalName");
  setStep("me", "ok", (me.displayName || "") + " (" + (me.mail || me.userPrincipalName || "") + ")");
}

async function testSite() {
  const found = [];
  let pick = null;
  for (const term of CONFIG.siteSearch) {
    const r = await graph("/sites?search=" + encodeURIComponent(term));
    for (const s of (r.value || [])) if (!found.find(x => x.id === s.id)) found.push(s);
    pick = found.find(s => norm(s.displayName).includes("central de gestao")) ||
           found.find(s => norm(s.displayName).includes("pcp"));
    if (pick) break;
  }
  if (!pick) throw new Error("Nenhum site do SharePoint encontrado com os termos de busca. Candidatos: " + found.length);
  ctx.site = pick;
  setStep("site", "ok", pick.displayName, [
    "id: " + pick.id,
    "endereço: " + pick.webUrl,
    "candidatos encontrados: " + found.map(s => s.displayName).join(" | ")
  ]);
}

async function testList() {
  const r = await graph(`/sites/${ctx.site.id}/lists?$select=id,displayName,name`);
  const lists = r.value || [];
  const lst = lists.find(l => norm(l.displayName).includes(CONFIG.listHint));
  if (!lst) throw new Error("Lista de visitas não encontrada. Listas do site: " + lists.map(l => l.displayName).join(" | "));
  ctx.list = lst;
  const cols = (await graph(`/sites/${ctx.site.id}/lists/${lst.id}/columns?$select=name,displayName,hidden`)).value || [];
  const names = cols.map(c => c.name);
  const missing = CONFIG.expectedListColumns.filter(n => !names.includes(n));
  const lines = ["id da lista: " + lst.id, "nome interno da lista: " + lst.name,
    "colunas esperadas encontradas: " + CONFIG.expectedListColumns.filter(n => names.includes(n)).join(", ")];
  if (missing.length) lines.push("FALTANDO: " + missing.join(", "));
  setStep("list", missing.length ? "warn" : "ok", lst.displayName, lines);
}

async function testFile() {
  const drives = (await graph(`/sites/${ctx.site.id}/drives?$select=id,name,webUrl`)).value || [];
  const hits = [];
  for (const d of drives) {
    try {
      const r = await graph(`/drives/${d.id}/root/search(q='${CONFIG.fileQuery}')?$select=id,name,webUrl,parentReference`);
      for (const it of (r.value || [])) {
        if (/\.xlsx$/i.test(it.name) && norm(it.name).includes(CONFIG.fileHint))
          hits.push({ driveId: d.id, driveName: d.name, id: it.id, name: it.name, webUrl: it.webUrl,
                      path: (it.parentReference && it.parentReference.path) || "" });
      }
    } catch (_) { /* biblioteca sem acesso: segue para a próxima */ }
  }
  if (!hits.length) throw new Error("Arquivo .xlsx não encontrado. Bibliotecas verificadas: " + drives.map(d => d.name).join(" | "));
  ctx.file = hits[0];
  setStep("file", hits.length > 1 ? "warn" : "ok", hits[0].name + (hits.length > 1 ? " (há mais de um candidato)" : ""),
    hits.map(h => h.name + "  |  biblioteca: " + h.driveName + "  |  pasta: " + h.path));
}

async function testTable() {
  const base = `/drives/${ctx.file.driveId}/items/${ctx.file.id}/workbook/tables`;
  const tables = (await graph(base + "?$select=id,name")).value || [];
  if (!tables.length) throw new Error("O arquivo não tem nenhuma Tabela do Excel (Ctrl+T).");
  const t = tables.find(x => norm(x.name).includes(CONFIG.tableHint)) || tables[0];
  ctx.table = t; ctx.tableBase = base + "/" + encodeURIComponent(t.id);
  setStep("table", "ok", t.name, ["tabelas no arquivo: " + tables.map(x => x.name).join(" | ")]);
}

function serialToDate(v) { return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10); }
function countBy(rows, idx) {
  const m = new Map();
  rows.forEach(r => { const k = String(r[idx] == null || r[idx] === "" ? "(vazio)" : r[idx]); m.set(k, (m.get(k) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

async function testData() {
  const hdr = (await graph(ctx.tableBase + "/headerRowRange?$select=values")).values[0].map(String);
  const body = (await graph(ctx.tableBase + "/dataBodyRange?$select=values")).values || [];
  const idx = name => hdr.findIndex(h => norm(h) === norm(name));
  const lines = ["colunas (" + hdr.length + "): " + hdr.join(" | "), "linhas de dados: " + body.length];
  const missing = CONFIG.expectedBaseColumns.filter(n => idx(n) < 0);
  if (missing.length) lines.push("FALTANDO: " + missing.join(", "));

  const iSite = idx(CONFIG.siteColumn), iWo = idx(CONFIG.woColumn);
  if (iSite >= 0) lines.push("sites distintos em " + CONFIG.siteColumn + ": " + new Set(body.map(r => String(r[iSite]).trim()).filter(Boolean)).size);
  if (iWo >= 0) lines.push("WOs preenchidas: " + body.filter(r => String(r[iWo]).trim() !== "").length + " de " + body.length);

  [CONFIG.statusColumn, ...CONFIG.otherColumnsToCount].forEach(col => {
    const i = idx(col);
    if (i < 0) return;
    const c = countBy(body, i), shown = c.slice(0, 30);
    lines.push("", "valores de \"" + col + "\":");
    shown.forEach(([k, n]) => lines.push("   " + n + " × " + k));
    if (c.length > shown.length) lines.push("   … e mais " + (c.length - shown.length) + " valores distintos");
  });

  const iDate = idx(CONFIG.dateColumn);
  if (iDate >= 0) {
    const filled = body.map(r => r[iDate]).filter(v => v !== "" && v != null);
    lines.push("", "\"" + CONFIG.dateColumn + "\": " + filled.length + " preenchidas de " + body.length);
    if (filled.length) {
      const ex = filled[0];
      lines.push("   exemplo bruto: " + JSON.stringify(ex) + " (tipo " + typeof ex + ")" +
                 (typeof ex === "number" ? "  →  data " + serialToDate(ex) : ""));
    }
  }
  setStep("data", missing.length ? "warn" : "ok",
          body.length + " linhas lidas" + (missing.length ? ", com colunas faltando" : ""), lines);
}

/* ============================================================
   INÍCIO
   ============================================================ */
async function runAll() {
  const okMe = await runStep("me", testMe);
  const okSite = okMe && await runStep("site", testSite);
  const okList = okSite && await runStep("list", testList);
  const okFile = okSite && await runStep("file", testFile);   // não depende da lista
  const okTable = okFile && await runStep("table", testTable);
  if (okTable) await runStep("data", testData);
  $("#btnCopy").hidden = false;
}

async function main() {
  buildSteps();
  if (typeof msal === "undefined") {
    showMsg("Não foi possível carregar a biblioteca de login da Microsoft (msal-browser). Verifique a internet e o endereço do script no código.");
    return;
  }
  app = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: "https://login.microsoftonline.com/" + CONFIG.tenantId, redirectUri: REDIRECT },
    cache: { cacheLocation: "sessionStorage" }
  });
  if (app.initialize) await app.initialize();       // necessário nas versões novas da biblioteca

  try { await app.handleRedirectPromise(); }
  catch (e) { showMsg("Erro no login: " + (e.errorMessage || e.message || e)); }

  const accounts = app.getAllAccounts();
  if (!accounts.length) {
    $("#btnLogin").hidden = false;
    $("#btnLogin").onclick = () => app.loginRedirect({ scopes: SCOPES });
    return;
  }
  account = accounts[0];
  $("#btnOut").hidden = false;
  $("#btnOut").onclick = () => app.logoutRedirect({ account, postLogoutRedirectUri: REDIRECT });
  $("#btnCopy").onclick = async () => {
    const text = report.join("\n");
    try { await navigator.clipboard.writeText(text); showMsg(""); $("#btnCopy").textContent = "Copiado!"; }
    catch (_) { window.prompt("Copie o texto abaixo (Ctrl+C):", text); }
  };
  setStep("login", "ok", "Conectado como " + account.username);
  await runAll();
}
main();
</script>
</body>
</html>
