<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fonte:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --laranja:#ff832b; --azul:#0f62fe; --cinza1:#f4f4f4; --cinza2:#e0e0e0; --texto:#161616; --suave:#6f6f6f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--fonte); font-size:13px; color:var(--texto); background:#fff; font-variant-numeric:tabular-nums; }
  .top { background:#161616; color:#fff; height:48px; display:flex; align-items:center; padding:0 24px; font-size:14px; }
  .top b { font-weight:600; margin-right:24px; }
  .top span { color:#c6c6c6; }
  .top .dir { margin-left:auto; font-size:12px; }
  .wrap { padding:24px; max-width:1600px; margin:0 auto; }
  h1 { font-size:24px; font-weight:400; margin-bottom:16px; }
  .oculto { display:none !important; }
  .g { color:var(--suave); }
  .lab { font-size:12px; color:#525252; margin-bottom:6px; }
  .campo { background:var(--cinza1); border:0; border-bottom:1px solid #8d8d8d; padding:11px 14px; font:inherit; font-size:14px; color:var(--texto); }
  .campo:focus { outline:2px solid var(--azul); outline-offset:-2px; }
  .btn { background:var(--azul); color:#fff; border:0; padding:11px 20px; font:inherit; font-size:13px; cursor:pointer; }
  .btn:hover { background:#0353e9; }
  .btn:disabled { background:#c6c6c6; cursor:not-allowed; }
  .btn2 { background:#fff; color:var(--azul); border:1px solid var(--azul); padding:9px 16px; font:inherit; font-size:13px; cursor:pointer; }
  .btn2:hover { background:#edf5ff; }
  .linha { display:flex; gap:20px; align-items:flex-end; flex-wrap:wrap; margin-bottom:20px; }
  .drop { border:1px dashed #8d8d8d; background:var(--cinza1); min-height:90px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; padding:12px; text-align:center; }
  .drop.sobre { background:#edf5ff; border-color:var(--azul); }
  .drop b { font-weight:600; font-size:14px; }
  .kv { display:grid; grid-template-columns:repeat(5,1fr); border:1px solid var(--cinza2); margin:20px 0; }
  .kv div { padding:12px 14px; border-right:1px solid var(--cinza2); }
  .kv div:last-child { border-right:0; }
  .kv .n { font-size:24px; font-weight:300; }
  .kv .l { color:var(--suave); font-size:12px; }
  .bl { border:1px solid var(--cinza2); margin-bottom:20px; }
  .bl h2 { background:var(--cinza1); font-size:14px; font-weight:600; padding:10px 14px; border-bottom:1px solid var(--cinza2); display:flex; justify-content:space-between; align-items:center; }
  .bl h2 .g { font-weight:400; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--cinza2); text-align:left; font-weight:600; font-size:12px; padding:8px 12px; white-space:nowrap; }
  td { padding:8px 12px; border-bottom:1px solid var(--cinza2); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  tbody tr.clic { cursor:pointer; }
  tbody tr.clic:hover { background:var(--cinza1); }
  .refazer { color:var(--laranja); font-weight:600; }
  .tag { display:inline-block; background:var(--cinza2); padding:1px 8px; font-size:12px; }
  .cab { display:flex; gap:48px; flex-wrap:wrap; border-bottom:1px solid var(--cinza2); padding-bottom:16px; margin-bottom:4px; align-items:flex-end; }
  .cab h2 { font-size:28px; font-weight:400; margin-right:16px; }
  .cab .k { color:var(--suave); font-size:12px; margin-bottom:4px; }
  .cab .v { font-size:14px; }
  .erro { color:#a2191f; }
  .ov { position:fixed; inset:0; background:rgba(22,22,22,.6); display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:40px 16px; z-index:10; }
  .mod { background:#fff; width:900px; max-width:100%; }
  .mh { display:flex; justify-content:space-between; align-items:flex-start; padding:20px 24px; border-bottom:1px solid var(--cinza2); }
  .mh h3 { font-size:22px; font-weight:400; }
  .mkv { display:flex; flex-wrap:wrap; gap:16px 40px; padding:14px 24px; background:var(--cinza1); border-bottom:1px solid var(--cinza2); }
  .mkv .k { color:var(--suave); font-size:12px; margin-bottom:3px; }
  .mkv .v { font-size:14px; }
  .msec { padding:16px 24px; }
  .msec h4 { font-size:14px; font-weight:600; margin-bottom:10px; }
  .ach { border-left:3px solid var(--laranja); background:var(--cinza1); padding:10px 14px; margin-bottom:8px; }
  .fotos { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .fto img { width:100%; height:130px; object-fit:cover; background:var(--cinza2); display:block; margin-bottom:4px; }
  .fto { font-size:12px; }
  .cmt { background:var(--cinza1); padding:10px 14px; white-space:pre-wrap; }
  .leg { margin-top:12px; font-size:12px; color:var(--suave); }
  .leg div { margin-bottom:4px; }
  .leg b { color:var(--texto); font-weight:600; }
  .bcv canvas { width:100%; max-width:560px; cursor:crosshair; display:block; touch-action:none; background:#161616; }
  .laranja { color:var(--laranja); }
  .x { background:none; border:0; font-size:22px; color:#525252; cursor:pointer; padding:0 4px; }
</style>
</head>
<body>
<div class="top"><b>Relatórios</b><span>Leitura e análise dos PDFs</span><span class="dir" id="usuario"></span></div>

<div class="wrap oculto" id="telaLogin" style="max-width:420px">
  <h1>Entrar</h1>
  <div class="lab">E-mail</div><input class="campo" id="email" type="email" style="width:100%;margin-bottom:12px">
  <div class="lab">Senha</div><input class="campo" id="senha" type="password" style="width:100%;margin-bottom:16px">
  <button class="btn" id="botaoEntrar">Entrar</button>
  <div id="msgLogin" class="erro" style="margin-top:12px"></div>
</div>

<div class="wrap oculto" id="telaApp">
  <h1>Análise por site</h1>
  <div class="linha">
    <div><div class="lab">Site</div><input class="campo" id="site" style="width:220px" placeholder="Ex.: SMBRE07" autocomplete="off"></div>
    <div><div class="lab">Mês</div><input class="campo" id="mes" type="month"></div>
    <button class="btn" id="botaoConsultar">Consultar</button>
  </div>
  <div id="msg"></div>
  <div id="cabSite"></div>

  <div id="areaPdf" class="oculto" style="margin-top:16px">
    <div class="lab">Relatórios do site (PDF)</div>
    <div class="drop" id="drop"><b>Arraste os PDFs deste site aqui</b><span class="g">ou clique para escolher · todas as abas de uma vez</span></div>
    <input type="file" id="arquivos" accept="application/pdf,.pdf" multiple class="oculto">
  </div>

  <div id="faixa"></div>
  <div id="barra" class="linha oculto" style="justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="display:flex;gap:12px;align-items:center"><span class="g">Mostrar</span>
      <select class="campo" id="filtro" style="font-size:13px;padding:8px 12px"><option value="todos">Todos</option><option value="refazer">Para refazer</option><option value="faltando">Faltando</option></select></div>
    <div style="display:flex;gap:12px"><button class="btn2" id="botaoExcel">Exportar Excel</button><button class="btn" id="botaoGravar">Gravar análise</button></div>
  </div>
  <div id="blocos"></div>
  <div id="ignorados"></div>
</div>

<div class="ov oculto" id="modal"><div class="mod" id="modCorpo"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";
  // ==== CONFIGURACAO =======================================================
  const ENDERECO = "https://aigibnwaqagbrwsvvaty.supabase.co";
  const CHAVE = "sb_publishable_kzyiGqvi1DbP1yAsc7SSrA_9wg1IOQD";
  const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
  const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";
  // Ticket provisório = mês e ano (112026 = novembro/2026, 102026 = outubro/2026).
  function ehProvisorio(t) { return /^(0[1-9]|1[0-2])20\d{2}$/.test(String(t || "")); }
  function mesDoProvisorio(t) { return String(t).slice(2) + "-" + String(t).slice(0, 2); }
  const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  // Cada sistema escreve o segmento de um jeito (PDF, Validação, Cronograma). Tudo vira a mesma chave.
  const ALIAS_SEG = { FONTECC: "FCC", QUADROCA: "QDCA", CONC: "BAIXATENSAO", CONCESSIONARIABT: "BAIXATENSAO", CONCESSIONYRIABT: "BAIXATENSAO", CONCESSIONARIAMT: "MEDIATENSAO", CONCESSIONYRIAMT: "MEDIATENSAO" };

  const $ = function (id) { return document.getElementById(id); };
  const banco = supabase.createClient(ENDERECO, CHAVE);
  let pdfjs = null;

  // ==== FUNCOES PURAS ======================================================
  function semAcento(t) { return String(t == null ? "" : t).normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function chaveSite(t) { return semAcento(t).toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function chaveSeg(t) {
    const k = semAcento(t).toUpperCase().replace(/&/g, "E").replace(/[^A-Z0-9]/g, "");
    if (ALIAS_SEG[k]) return ALIAS_SEG[k];
    if (/^CONCESSION.*BT$/.test(k)) return "BAIXATENSAO";
    if (/^CONCESSION.*MT$/.test(k)) return "MEDIATENSAO";
    return k;
  }
  function chaveTag(t) { return semAcento(t).toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function soDigitos(t) { return String(t == null ? "" : t).replace(/\D/g, "").replace(/^0+/, ""); }
  function dataIso(br) { const m = String(br || "").match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + "-" + m[2] + "-" + m[1] : null; }
  function dataBr(iso) { const m = String(iso || "").match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + "/" + m[2] + "/" + m[1] : "—"; }
  function nomeMes(ym) { const m = String(ym).match(/(\d{4})-(\d{2})/); return m ? MESES[Number(m[2]) - 1] + "/" + m[1] : ym; }
  function normFato(t) { return semAcento(t).toUpperCase().replace(/\s+/g, " ").trim(); }

  // Classifica o tipo da WO pelo texto da base ("PREVENTIVA INFRA - ENERGIA", "Climatização"...).
  function tipoWO(t) {
    const x = semAcento(t).toUpperCase();
    if (x.indexOf("CLIMA") >= 0) return "Climatização";
    if (x.indexOf("ENERGIA") >= 0) return "Energia";
    if (x.indexOf("ZELADORIA") >= 0) return "Zeladoria";
    if (x.indexOf("UPS") >= 0) return "UPS";
    if (x.indexOf("GMG") >= 0 || x.indexOf("GERADOR") >= 0) return "Gerador";
    return String(t || "").trim() || "Outro";
  }

  function segDoPdf(txt) { return chaveSeg(txt); }

  // Junta os pedaços de texto do pdf.js em linhas (mesmo "y" = mesma linha).
  function linhasRicas(items) {
    const it = items.filter(function (i) { return i.str && i.str.trim() !== ""; })
      .map(function (i) { return { s: i.str.trim(), x: i.transform[4], y: i.transform[5], w: i.width || 0 }; });
    it.sort(function (a, b) { return b.y - a.y || a.x - b.x; });
    const linhas = [];
    let atual = null;
    it.forEach(function (i) {
      if (!atual || Math.abs(atual.y - i.y) > 2.5) { atual = { y: i.y, p: [] }; linhas.push(atual); }
      atual.p.push(i);
    });
    return linhas.map(function (l) { l.p.sort(function (a, b) { return a.x - b.x; }); l.t = l.p.map(function (p) { return p.s; }).join(" ").replace(/\s+/g, " ").trim(); return l; });
  }
  function juntarLinhas(items) { return linhasRicas(items).map(function (l) { return l.t; }); }

  // Lê o que importa da primeira página de um relatório.
  function interpretarPagina1(linhas, arquivo) {
    const r = { arquivo: arquivo, site: null, segmentoTxt: null, segmento: null, tag: null, tickets: [], ticket: null, situacaoFinal: null, realizadaPor: null, dataInicio: null, horaInicio: null, dataFim: null, horaFim: null, ok: false };
    const todo = linhas.join("\n");
    const mNome = todo.match(/Nome:\s*(.+?)\s+Cidade:/);
    if (mNome) r.site = mNome[1].trim();
    const iPlanta = linhas.findIndex(function (l) { return /Planta:/.test(l); });
    if (iPlanta >= 0) {
      for (let i = iPlanta + 1; i < Math.min(linhas.length, iPlanta + 6); i++) {
        const l = linhas[i];
        if (!l || /:/.test(l) || /^Tickets?$/i.test(l) || /^Ticket\b/.test(l)) continue;
        const p = l.split(" - ");
        r.segmentoTxt = p[0].trim();
        r.tag = p.length > 1 ? p.slice(1).join(" - ").trim() : null;
        break;
      }
    }
    if (r.segmentoTxt) r.segmento = segDoPdf(r.segmentoTxt);
    const reTk = /^(\S+)\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2}:\d{2})\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2}:\d{2})\s+(.+)$/;
    linhas.forEach(function (l) {
      const m = l.match(reTk);
      if (m) r.tickets.push({ ticket: m[1], dataInicio: m[2], horaInicio: m[3], dataFim: m[4], horaFim: m[5], situacao: m[6] });
    });
    if (r.tickets.length) {
      const t = r.tickets[0];
      r.ticket = t.ticket; r.dataInicio = t.dataInicio; r.horaInicio = t.horaInicio; r.dataFim = t.dataFim; r.horaFim = t.horaFim;
    }
    const mSit = todo.match(/Situação Final:\s*(.+)/);
    if (mSit) r.situacaoFinal = mSit[1].trim();
    const mRea = todo.match(/Realizada por:\s*(.+)/);
    if (mRea) r.realizadaPor = mRea[1].trim();
    r.ok = !!(r.site && r.segmento);
    return r;
  }

  // ==== MEDIÇÕES E ALARMES =================================================
  // Limites usados na análise técnica. Ajuste aqui conforme a realidade da operação.
  const LIM = {
    tensaoFN: [[105, 145], [190, 250]],      // fase-neutro: sistema 127 V ou 220 V
    tensaoFF: [[190, 245], [340, 420]],      // fase-fase: 220 V ou 380 V
    razaoFFFN: 1.732, tolRazao: 0.10,        // fase-fase deve ser ~1,73 x fase-neutro
    desqTensao: 10,                          // desequilíbrio máximo entre fases (%)
    desqCorrente: 25,                        // desequilíbrio máximo entre fases (%)
    tempMax: 70,                             // temperatura máxima (ºC)
    dcV: [44, 58],                           // tensão de saída DC do retificador (V)
    fatorAcDc: 5                             // corrente AC acima de 5x o esperado pela carga DC é suspeita
  };

  function nums(l) { return (String(l).match(/-?\d+(?:[.,]\d+)?/g) || []).map(function (x) { return parseFloat(x.replace(",", ".")); }); }
  function situacaoDe(l) { const m = String(l).match(/(NÃO OK|NAO OK|OK|NA)\s*$/); return m ? m[1] : null; }
  function fmt(v) { return String(Math.round(v * 100) / 100).replace(".", ","); }
  function dentro(v, faixas) { return faixas.some(function (f) { return v >= f[0] && v <= f[1]; }); }

  // Lê os valores de uma linha de medição pela posição das colunas do cabeçalho (campo em branco = null).
  function valoresFase(l, cab) {
    const fase = (cab || []).filter(function (c) { return /^Fase/i.test(c.s); });
    if (!fase.length || cab.length < 2) return nums(l.t).slice(0, 3);
    const centros = cab.map(function (c) { return c.x + c.w / 2; });
    const esp = centros[1] - centros[0];
    const out = fase.map(function () { return null; });
    l.p.forEach(function (p) {
      if (!/^-?\d+(?:[.,]\d+)?$/.test(p.s)) return;
      let k = 0, melhor = 1e9;
      centros.forEach(function (c, idx) { const d = Math.abs(p.x - (c - esp / 2 + 7)); if (d < melhor) { melhor = d; k = idx; } });
      if (k < fase.length) out[k] = parseFloat(p.s.replace(",", "."));
    });
    return out;
  }

  // Lê os blocos "Medição - ..." de todas as páginas (linhas com posição).
  function extrairMedicoes(L) {
    const m = {};
    for (let i = 0; i < L.length; i++) {
      const t = L[i].t.match(/^Medição - (.+)$/);
      if (!t) continue;
      const tit = t[1].toUpperCase();
      const bloco = [];
      let j = i + 1;
      while (j < L.length && !/^Medição - /.test(L[j].t) && !/^(Histórico de Ações|Fotos do Relatório|Observação)/.test(L[j].t)) { bloco.push(L[j]); j++; }
      let cab = null;
      const dados = [];
      bloco.forEach(function (l) { if (/^Fase\b/.test(l.t)) cab = l.p; else if (/^-?\d/.test(l.t)) dados.push({ l: l, cab: cab }); });
      const vf = function (d) { return d ? valoresFase(d.l, d.cab) : null; };
      if (/^TENSÃO\(VCA\)/.test(tit)) { m.tensaoFN = vf(dados[0]); m.tensaoFF = vf(dados[1]); }
      else if (/^CORRENTE\(A\)/.test(tit)) { m.corrente = vf(dados[0]); }
      else if (/^TEMPERATURA/.test(tit)) { m.temp = vf(dados[0]); }
      else if (/^BALANCEAMENTO/.test(tit)) { m.balanc = vf(dados[0]); }
      else if (/^TENSÃO ENT\. AC/.test(tit)) { m.acTensao = vf(dados[0]); }
      else if (/^CORRENTE DE ENTRADA AC/.test(tit)) { m.acCorrente = vf(dados[0]); }
      else if (/^POTÊNCIA/.test(tit)) { if (dados[0]) { const n = nums(dados[0].l.t); m.potKw = n[0]; m.potPct = n[1]; } }
      else if (/^GERAL/.test(tit)) {
        const B = bloco.map(function (l) { return l.t; });
        B.forEach(function (l, k) {
          const mm = l.match(/^(.+?)\s+(-?\d+(?:[.,]\d+)?)\s+(?:OK|NÃO OK|NAO OK|NA)\b/);
          let rot = null, val = null;
          if (mm) { rot = mm[1]; val = parseFloat(mm[2].replace(",", ".")); }
          else if (/^-?\d+(?:[.,]?\d+)?\s+(?:OK|NÃO OK|NAO OK|NA)\b/.test(l) && k > 0) { rot = B[k - 1]; val = parseFloat(l.match(/^-?\d+(?:[.,]\d+)?/)[0].replace(",", ".")); }
          if (rot == null) return;
          if (/TENSÃO DE SAÍDA DC/.test(rot)) m.dcV = val;
          else if (/CORRENTE DE SAÍDA DC/.test(rot)) m.dcI = val;
          else if (/FLUT/.test(rot)) m.dcFlut = val;
        });
      }
    }
    return m;
  }

  // Regras de coerência das medições. Cada achado vem como "título||explicação".
  function lista(v) { return (v || []).map(function (x) { return x == null ? "—" : fmt(x); }).join(" / "); }
  function pres(v) { return (v || []).filter(function (x) { return x != null && !isNaN(x); }); }
  function media(v) { return v.reduce(function (s0, x) { return s0 + x; }, 0) / v.length; }
  function desq(v) { const med = media(v); return med ? (Math.max.apply(null, v) - Math.min.apply(null, v)) / med * 100 : 0; }
  function analisarMedicoes(m) {
    const a = [];
    const fn = pres(m.tensaoFN), ff = pres(m.tensaoFF), co = pres(m.corrente), ac = pres(m.acCorrente), tp = pres(m.temp);
    if (fn.some(function (x) { return !dentro(x, LIM.tensaoFN); })) a.push("Tensão fase-neutro fora da faixa: " + lista(m.tensaoFN) + " V||O esperado é de 105 a 145 V (rede 127 V) ou de 190 a 250 V (rede 220 V). Valor fora disso costuma ser erro de digitação, medição na fase errada ou problema real na rede.");
    if (fn.length >= 2 && desq(fn) > LIM.desqTensao) a.push("Tensão fase-neutro desequilibrada (" + fmt(desq(fn)) + "%): " + lista(m.tensaoFN) + " V||A diferença entre a maior e a menor fase é de " + fmt(desq(fn)) + "% da média; o limite adotado é " + LIM.desqTensao + "%. Fases muito diferentes indicam digitação errada ou rede com problema.");
    if (fn.length === 3 && fn[0] === fn[1] && fn[1] === fn[2]) a.push("Tensão fase-neutro igual nas 3 fases: " + fmt(fn[0]) + " V||Três medições idênticas, sem nenhuma variação, sugerem que o valor foi copiado em vez de medido.");
    if (ff.some(function (x) { return !dentro(x, LIM.tensaoFF); })) a.push("Tensão fase-fase fora da faixa: " + lista(m.tensaoFF) + " V||O esperado é de 190 a 245 V (rede 220 V) ou de 340 a 420 V (rede 380 V).");

    if (fn.length && ff.length) {
      const f1 = media(fn), f2 = media(ff);

  // Leitura de medidor em sequência, repetida ou curta demais.
  function leituraSuspeita(txt) {
    const d = String(txt || "").replace(/\D/g, "");
    if (!d) return false;
    if (d.length < 3) return true;
    if (/^(\d)\1+$/.test(d)) return true;
    let asc = true, desc = true, par = d.length % 2 === 0;
    for (let i = 1; i < d.length; i++) {
      const x = Number(d[i]) - Number(d[i - 1]);
      if (x !== 1 && !(d[i - 1] === "9" && d[i] === "0")) asc = false;
      if (x !== -1 && !(d[i - 1] === "0" && d[i] === "9")) desc = false;
    }
    if (asc || desc) return true;
    if (par) {
      let ok = true;
      for (let i = 0; i < d.length; i += 2) if (d[i] !== d[i + 1]) ok = false;
      if (ok) return true;
    }
    return false;
  }

  // Comentário e justificativa que o técnico escreveu no relatório.
  function extrairComentarios(T) {
    const i = T.findIndex(function (l) { return /^Observação/.test(l); });
    const out = { comentario: "", justificativa: "" };
    if (i < 0) return out;
    const com = [], jus = [];
    let modo = "c";
    for (let k = i + 1; k < T.length; k++) {
      const l = T[k];
      if (/^(Histórico de Ações|Fotos do Relatório|Relato \d)/.test(l)) break;
      if (/^Comentários$/.test(l)) { modo = "c"; continue; }
      if (/^Justificativas$/.test(l)) { modo = "j"; continue; }
      (modo === "j" ? jus : com).push(l);
    }
    out.comentario = com.join(" ").trim();
    out.justificativa = jus.join(" ").trim();
    return out;
  }

  // ==== FOTOS ==============================================================
  const FOTO_MIN = 200;          // lado mínimo (px) para considerar foto; abaixo disso é logotipo/ícone
  const FOTO_DIST = 8;           // diferença máxima (de 256 bits) para duas fotos serem "a mesma"
  const FOTO_MAX = 1280;         // largura máxima guardada
  const TESSERACT = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";

  function mulM(a, b) { return [a[0] * b[0] + a[1] * b[2], a[0] * b[1] + a[1] * b[3], a[2] * b[0] + a[3] * b[2], a[2] * b[1] + a[3] * b[3], a[4] * b[0] + a[5] * b[2] + b[4], a[4] * b[1] + a[5] * b[3] + b[5]]; }
  function imagemParaCanvas(img) {
    const c = document.createElement("canvas");
    if (img.bitmap) { c.width = img.bitmap.width; c.height = img.bitmap.height; c.getContext("2d").drawImage(img.bitmap, 0, 0); return c; }
    const w = img.width, h = img.height, n = w * h, d = img.data;
    if (!d) return null;
    c.width = w; c.height = h;
    const ctx = c.getContext("2d"), out = ctx.createImageData(w, h), o = out.data;
    if (d.length === n * 4) o.set(d);
    else if (d.length === n * 3) for (let i = 0; i < n; i++) { o[i * 4] = d[i * 3]; o[i * 4 + 1] = d[i * 3 + 1]; o[i * 4 + 2] = d[i * 3 + 2]; o[i * 4 + 3] = 255; }
    else if (d.length === n) for (let i = 0; i < n; i++) { o[i * 4] = o[i * 4 + 1] = o[i * 4 + 2] = d[i]; o[i * 4 + 3] = 255; }
    else return null;
    ctx.putImageData(out, 0, 0);
    return c;
  }
  function dhash(c) {
    const s2 = document.createElement("canvas"); s2.width = 17; s2.height = 16;
    const x = s2.getContext("2d"); x.drawImage(c, 0, 0, 17, 16);
    const d = x.getImageData(0, 0, 17, 16).data;
    const g = function (i) { return d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11; };

    for (let y = 0; y < 16; y++) for (let k = 0; k < 16; k++) bits += g(y * 17 + k) > g(y * 17 + k + 1) ? "1" : "0";

  }
  function distHash(a, b) { let n = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) n++; return n; }

  // Acha as fotos de uma página, com a legenda (texto logo abaixo ou acima).
  async function extrairFotos(lib, pag, numPag, items) {
    const O = lib.OPS;
    const ol = await pag.getOperatorList();
    let ctm = [1, 0, 0, 1, 0, 0];
    const pilha = [], achadas = [];
    for (let i = 0; i < ol.fnArray.length; i++) {
      const fn = ol.fnArray[i], ar = ol.argsArray[i];
      if (fn === O.save) pilha.push(ctm.slice());
      else if (fn === O.restore) ctm = pilha.pop() || [1, 0, 0, 1, 0, 0];
      else if (fn === O.transform) ctm = mulM(ar, ctm);
      else if (fn === O.paintImageXObject) {
        const id = ar[0];
        if (/^g_/.test(id)) continue;
        const w = Math.hypot(ctm[0], ctm[1]), h = Math.hypot(ctm[2], ctm[3]);
        const x0 = Math.min(ctm[4], ctm[4] + ctm[0] + ctm[2]), y0 = Math.min(ctm[5], ctm[5] + ctm[1] + ctm[3]);
        achadas.push({ id: id, x: x0, y: y0, w: w, h: h });
      }
    }
    const fotos = [];
    for (let k = 0; k < achadas.length; k++) {
      const a = achadas[k];
      const obj = await new Promise(function (res) { let feito = false; const t = setTimeout(function () { if (!feito) res(null); }, 4000); try { pag.objs.get(a.id, function (o) { feito = true; clearTimeout(t); res(o); }); } catch (e) { clearTimeout(t); res(null); } });
      if (!obj || (obj.width || 0) < FOTO_MIN || (obj.height || 0) < FOTO_MIN) continue;
      const c = imagemParaCanvas(obj);
      if (!c) continue;
      // legenda: linhas de texto logo abaixo da foto (até 45 pt) dentro da largura dela; se não houver, logo acima
      const noX = items.filter(function (t) { return t.str && t.str.trim() && t.transform[4] >= a.x - 6 && t.transform[4] <= a.x + a.w; });
      let cand = noX.filter(function (t) { return t.transform[5] <= a.y + 2 && t.transform[5] >= a.y - 45; });
      if (!cand.length) cand = noX.filter(function (t) { return t.transform[5] >= a.y + a.h - 2 && t.transform[5] <= a.y + a.h + 30; });
      cand.sort(function (u, v) { return Math.abs(u.transform[5] - a.y) - Math.abs(v.transform[5] - a.y) || u.transform[4] - v.transform[4]; });
      const legenda = cand.length ? cand.filter(function (t) { return Math.abs(t.transform[5] - cand[0].transform[5]) < 3; }).sort(function (u, v) { return u.transform[4] - v.transform[4]; }).map(function (t) { return t.str.trim(); }).join(" ") : "";
      if (/^INFRATEL$/i.test(legenda) || (numPag === 1 && !legenda)) continue;   // logotipos do cabeçalho
      const esc2 = Math.min(1, FOTO_MAX / c.width);
      const c2 = document.createElement("canvas"); c2.width = Math.round(c.width * esc2); c2.height = Math.round(c.height * esc2);
      c2.getContext("2d").drawImage(c, 0, 0, c2.width, c2.height);
      fotos.push({ pagina: numPag, legenda: legenda, w: c.width, h: c.height, hash: dhash(c2), url: c2.toDataURL("image/jpeg", 0.82), repetida: null, carimbo: null });
    }
    return fotos;
  }
  function marcarRepetidas(fotos) {
    fotos.forEach(function (f, i) {
      for (let j = 0; j < i; j++) if (distHash(f.hash, fotos[j].hash) <= FOTO_DIST) { f.repetida = j + 1; break; }
    });
    return fotos;
  }

  // Lê data e hora carimbadas na foto (texto do OCR).
  const MESES_ABR = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
  function lerCarimbo(txt) {
    const t = String(txt || "").replace(/[Oo](?=\d)|(?<=\d)[Oo]/g, "0").replace(/\s+/g, " ");
    let d = null, m;
    if ((m = t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(20\d{2})/))) d = [Number(m[3]), Number(m[2]), Number(m[1])];
    else if ((m = t.match(/(20\d{2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/))) d = [Number(m[1]), Number(m[2]), Number(m[3])];
    else if ((m = t.match(/(\d{1,2})\D{0,6}(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\D{0,8}(20\d{2})/i))) d = [Number(m[3]), MESES_ABR[m[2].toLowerCase()], Number(m[1])];
    const h = t.match(/\b([01]?\d|2[0-3]):([0-5]\d)(?::[0-5]\d)?\b/);
    if (!d || d[1] < 1 || d[1] > 12 || d[2] < 1 || d[2] > 31) return h ? { data: null, hora: h[0] } : null;
    const pad = function (n) { return (n < 10 ? "0" : "") + n; };
    return { data: d[0] + "-" + pad(d[1]) + "-" + pad(d[2]), hora: h ? h[0] : null };
  }
  let tess = null, tessFalhou = false;
  async function carregarTesseract() {
    if (tess) return tess;
    if (tessFalhou) return null;
    try {
      await new Promise(function (ok, no) { const sc = document.createElement("script"); sc.src = TESSERACT; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
      tess = await window.Tesseract.createWorker("eng");
      return tess;
    } catch (e) { tessFalhou = true; return null; }
  }
  function carregarImg(url) { return new Promise(function (ok, no) { const im = new Image(); im.onload = function () { ok(im); }; im.onerror = no; im.src = url; }); }
  // O carimbo (data, hora e endereço) fica no canto inferior direito, em letra branca: recorta, amplia e isola o branco.
  const PLANOS_OCR = [{ l: 0.45, t: 0.72, th: 215, psm: "6" }, { l: 0.45, t: 0.72, th: 235, psm: "6" }, { l: 0.45, t: 0.72, th: 250, psm: "6" }, { l: 0.45, t: 0.72, th: 0, psm: "6" }, { l: 0, t: 0.55, th: 225, psm: "11" }];
  async function ocrFoto(w, foto) {
    const im = await carregarImg(foto.url);
    for (let k = 0; k < PLANOS_OCR.length; k++) {
      const p = PLANOS_OCR[k];
      const x0 = Math.floor(im.width * p.l), y0 = Math.floor(im.height * p.t), cw = im.width - x0, ch = im.height - y0;
      const c = document.createElement("canvas"); c.width = cw * 3; c.height = ch * 3;
      const x = c.getContext("2d"); x.drawImage(im, x0, y0, cw, ch, 0, 0, c.width, c.height);
      const dd = x.getImageData(0, 0, c.width, c.height), px = dd.data;

        const g = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
        const v = p.th ? (g >= p.th ? 0 : 255) : g;
        px[i] = px[i + 1] = px[i + 2] = v;
      }
      x.putImageData(dd, 0, 0);
      await w.setParameters({ tessedit_pageseg_mode: p.psm });
      const r = await w.recognize(c);

      if (ca && ca.data) return ca;
    }
    return null;
  }
  async function lerCarimbos() {
    const fila = [];
    E.pdfs.forEach(function (p) { (p.fotos || []).forEach(function (f) { if (f.carimbo === null) fila.push([p, f]); }); });
    if (!fila.length) return;
    $("msg").textContent = "Preparando a leitura de data e hora das fotos...";
    const w = await carregarTesseract();
    if (!w) { $("msg").textContent = "Não consegui carregar a leitura de data e hora das fotos."; return; }
    const consulta = E.siteChave + E.mes;
    for (let i = 0; i < fila.length; i++) {
      if (consulta !== E.siteChave + E.mes) return;
      $("msg").textContent = "Lendo data e hora das fotos: " + (i + 1) + " de " + fila.length;
      try { fila[i][1].carimbo = (await ocrFoto(w, fila[i][1])) || false; } catch (e) { fila[i][1].carimbo = false; E.ocrErro = String((e && e.message) || e); }
      fila[i][0].ocrFeito = (fila[i][0].fotos || []).every(function (f) { return f.carimbo !== null; });
      if (fila[i][0].ocrFeito) recalcular();
    }
    $("msg").textContent = E.ocrErro ? "Erro na leitura de data e hora das fotos: " + E.ocrErro : "";

  // ==== LEITURA DOS PDFs ===================================================
  async function carregarPdfjs() {
    if (pdfjs) return pdfjs;
    pdfjs = await import(PDFJS);
    pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    return pdfjs;
  }
  async function lerPdf(arquivo) {
    const lib = await carregarPdfjs();
    const doc = await lib.getDocument({ data: await arquivo.arrayBuffer() }).promise;
    const todasR = []; let primeira = null, fotos = [];
    for (let n = 1; n <= doc.numPages; n++) {
      const pag = await doc.getPage(n);
      const tc = await pag.getTextContent();
      try { (await extrairFotos(lib, pag, n, tc.items)).forEach(function (f) { fotos.push(f); }); } catch (e) { /* segue sem fotos desta página */ }
      const ric = linhasRicas(tc.items);
      const lin = ric.map(function (l) { return l.t; });
      if (n === 1) primeira = lin;
      ric.forEach(function (l) { if (!/^Infratel - Relat/.test(l.t) && !/^Página \d+ de \d+/.test(l.t)) todasR.push(l); });
    }
    const r = interpretarPagina1(primeira, arquivo.name);
    r.paginas = doc.numPages;
    const todas = todasR.map(function (l) { return l.t; });
    r.medicoes = extrairMedicoes(todasR);
    r.alarmes = extrairAlarmes(todas);
    const cm = extrairComentarios(todas);
    r.comentario = cm.comentario; r.justificativa = cm.justificativa;
    r.fotos = marcarRepetidas(fotos);
    const lm = todas.filter(function (x) { return /Leitura Medidor/i.test(x); })[0];
    r.leitura = lm ? (lm.match(/Leitura Medidor\s*:?\s*(.*)$/i) || [])[1] : null;
    try { doc.destroy(); } catch (e) { /* ignora */ }
    return r;
  }
  async function receberArquivos(lista) {
    const arqs = Array.prototype.slice.call(lista).filter(function (f) { return /\.pdf$/i.test(f.name); });
    if (!arqs.length) return;
    for (let i = 0; i < arqs.length; i++) {
      $("msg").textContent = "Lendo " + (i + 1) + " de " + arqs.length + "...";
      let r;
      try { r = await lerPdf(arqs[i]); }
      catch (e) { E.ignorados.push({ arquivo: arqs[i].name, motivo: "Não consegui ler o PDF" }); continue; }
      if (!r.ok) { E.ignorados.push({ arquivo: r.arquivo, motivo: "Não encontrei o site ou o segmento no relatório" }); continue; }
      if (chaveSite(r.site) !== E.siteChave) { E.ignorados.push({ arquivo: r.arquivo, motivo: "Relatório de outro site (" + r.site + ")" }); continue; }
      E.pdfs = E.pdfs.filter(function (p) { return p.arquivo !== r.arquivo; });
      E.pdfs.push(r);
    }
    $("msg").textContent = "";
    recalcular();
    lerCarimbos();
  }
  $("drop").addEventListener("click", function () { $("arquivos").click(); });
  $("arquivos").addEventListener("change", function (e) { receberArquivos(e.target.files); e.target.value = ""; });
  $("drop").addEventListener("dragover", function (e) { e.preventDefault(); $("drop").classList.add("sobre"); });
  $("drop").addEventListener("dragleave", function () { $("drop").classList.remove("sobre"); });
  $("drop").addEventListener("drop", function (e) { e.preventDefault(); $("drop").classList.remove("sobre"); receberArquivos(e.dataTransfer.files); });

  // ==== ANALISE ============================================================
  function ativo(e) {
    const sp = semAcento(e.situacao_prev || "").toUpperCase().replace(/\s+/g, "");
    if (sp === "N/A" || sp === "NA") return false;                       // cronograma diz que não se aplica
    const st = semAcento(e.status_eqpto || "").toUpperCase().trim();
    if (/^(INATIV|DESATIV|RETIRAD|DESINSTAL|BAIXAD)/.test(st)) return false;
    return (e.tag && String(e.tag).trim() !== "") || st === "ATIVO";
  }
  function regraDe(segKey) { return E.regras.filter(function (r) { return chaveSeg(r.segmento) === segKey; })[0] || null; }

  // Monta as linhas esperadas de cada WO a partir das regras e do Cronograma (equipamentos_base).
  function montarEsperado() {
    const out = [];
    const ordem = ["Energia", "Climatização"];
    const tipos = [];
    E.wos.forEach(function (w) { const t = tipoWO(w.tipo); if (tipos.indexOf(t) < 0) tipos.push(t); });
    tipos.sort(function (a, b) { const ia = ordem.indexOf(a), ib = ordem.indexOf(b); return (ia < 0 ? 9 : ia) - (ib < 0 ? 9 : ib); });
    const temClima = E.equip.some(function (e) { return tipoWO(e.tipo) === "Climatização" && chaveSeg(e.segmento) === "CLIMA" && ativo(e); }) ||
      E.pdfs.some(function (p) { return p.segmento === "CLIMA"; }) ||
      E.vals.some(function (v) { return chaveSeg(v.segmento) === "CLIMA" && String(v.mes_inicio || v.inicio || "").slice(0, 7) === E.mes; });
    const temEnergia = tipos.indexOf("Energia") >= 0;
    tipos.forEach(function (tipo) {
      const wo = E.wos.filter(function (w) { return tipoWO(w.tipo) === tipo; }).map(function (w) { return w.wo; }).join(", ");
      const bloco = "WO " + tipo + " · " + wo;
      E.regras.forEach(function (r) {
        if (tipo !== "Energia" && temEnergia && r.situacao_wo === "Solta") return;   // abas soltas já estão na WO de Energia
        const modo = tipo === "Energia" ? r.obrig_energia : tipo === "Climatização" ? r.obrig_clima : "nao";
        if (!modo || modo === "nao" || modo === "outro_setor") return;
        const sk = chaveSeg(r.segmento);
        const eqs = E.equip.filter(function (e) { return tipoWO(e.tipo) === tipo && chaveSeg(e.segmento) === sk && ativo(e); });
        if (modo === "se_clima" && !temClima) return;
        if (modo === "cronograma") { eqs.forEach(function (e) { out.push({ bloco: bloco, tipoWo: tipo, wo: wo, seg: r.segmento, segKey: sk, tag: e.tag || null, obrig: "Sim", doCrono: true, regra: r, eq: e }); }); return; }
        const obrig = modo === "condicional" ? "Condicional" : "Sim";
        if (eqs.length) eqs.forEach(function (e) { out.push({ bloco: bloco, tipoWo: tipo, wo: wo, seg: r.segmento, segKey: sk, tag: e.tag || null, obrig: obrig, doCrono: true, regra: r, eq: e }); });
        else out.push({ bloco: bloco, tipoWo: tipo, wo: wo, seg: r.segmento, segKey: sk, tag: null, obrig: obrig, doCrono: false, regra: r });
      });
    });
    return out;
  }

  // Escolhe, entre as linhas da Validação, as que correspondem a este segmento/tag.
  function acharValidacao(segKey, tag, rep) {
    const doSeg = E.vals.filter(function (v) { return chaveSeg(v.segmento) === segKey; });
    if (!doSeg.length) return [];
    let c = doSeg;
    if (tag) { const t = chaveTag(tag); const porTag = doSeg.filter(function (v) { return chaveTag(v.tag) === t; }); if (porTag.length) c = porTag; }
    if (rep && rep.dataInicio && c.length > 1) { const di = dataIso(rep.dataInicio); const porData = c.filter(function (v) { return v.inicio === di; }); if (porData.length) c = porData; }
    return c;
  }

  function analisarLinha(l) {
    const a = [];
    const rep = l.rep;
    const cands = acharValidacao(l.segKey, l.tag || (rep && rep.tag), rep);
    const noMes = cands.filter(function (v) { return String(v.mes_inicio || v.inicio || "").slice(0, 7) === E.mes; });
    const val = (noMes.length ? noMes : cands).slice().sort(function (x, y) { return String(y.inicio).localeCompare(String(x.inicio)) || (y.ocorrencia || 1) - (x.ocorrencia || 1); })[0] || null;
    l.val = val;
    if (!rep) {
      l.faltando = l.obrig === "Sim" && !noMes.length;
      l.semPdf = l.obrig === "Sim" && !l.faltando && !!noMes.length;
      return a;
    }
    if (l.dups && l.dups.length) a.push("Mais de um PDF para a mesma aba (" + [rep.arquivo].concat(l.dups.map(function (d) { return d.arquivo; })).join(" e ") + ")||O sistema do cliente conta uma ficha só por aba. Se o técnico preencheu duas vezes ou o sistema duplicou, o cliente precisa invalidar a errada.");
    // ticket
    const tk = String(rep.ticket || "");
    if (!tk) a.push("Relatório sem ticket");
    else if (ehProvisorio(tk)) {
      // Provisório (mês e ano) é uma regra combinada quando a WO demora a abrir: só avisa se for de outro mês.
      if (mesDoProvisorio(tk) !== E.mes) a.push("Ticket provisório de " + nomeMes(mesDoProvisorio(tk)) + " em relatório de " + nomeMes(E.mes) + "||O ticket provisório (mês e ano) deve ser do mesmo mês da preventiva.");
    }
    else {
      const wo = E.wos.filter(function (w) { return soDigitos(w.wo) === soDigitos(tk); })[0];
      if (!wo) a.push("Ticket " + tk + " não é de nenhuma WO deste site no mês");
      else {
        const tipoT = tipoWO(wo.tipo);
        let aceitos = l.regra ? (l.regra.tickets_aceitos || []).slice() : [];
        if (l.doCrono) aceitos = [l.tipoWo].concat(l.regra && l.regra.situacao_wo === "Climatização" ? aceitos : []);
        if (aceitos.length && aceitos.indexOf(tipoT) < 0) a.push("Ticket de " + tipoT + " em aba de " + l.seg);
      }
    }
    // mês de início e validação
    if (!val) a.push("Sem registro na validação do cliente||Esta aba não aparece na planilha de Validação carregada: o técnico não a finalizou ou a planilha está desatualizada.");
    else {
      if (!noMes.length) a.push("Aba iniciada em " + nomeMes(String(val.inicio).slice(0, 7)) + ": não conta para " + nomeMes(E.mes) + "||O cliente conta a aba pelo mês em que ela foi iniciada. Iniciada em outro mês e finalizada neste, ela vale para o mês de início e precisa ser refeita.");
      if (noMes.length > 1) a.push("Aba preenchida mais de uma vez (" + noMes.length + "): invalidar a incorreta no sistema do cliente||O cliente só conta uma ficha por aba. Se o técnico preencheu duas vezes ou o sistema duplicou, o cliente precisa invalidar a errada.");
      if (normFato(val.status) === "EM ANDAMENTO") a.push("Aba em andamento no sistema do cliente");
      if (rep.situacaoFinal && val.fato && normFato(rep.situacaoFinal) !== normFato(val.fato)) a.push("Fato na validação (" + val.fato + ") difere da Situação Final do relatório (" + rep.situacaoFinal + ")||O resultado marcado no sistema do cliente é diferente do que consta no relatório. Se o técnico apontou pendência e finalizou como OK, o cliente pode recusar.");
    }
    // comentário do técnico x resultado
    const txt = ((rep.comentario || "") + " " + (rep.justificativa || "")).trim();
    const fatoAba = String((val && val.fato) || rep.situacaoFinal || "");
    const fechadaOk = semAcento(fatoAba).toUpperCase().trim() === "OK";
    if (txt && fechadaOk) {
      const mp = txt.match(RE_PENDENCIA);
      if (mp) a.push("Comentário indica pendência, mas a aba foi fechada como OK||O técnico escreveu \"" + (txt.length > 160 ? txt.slice(0, 160) + "..." : txt) + "\" (palavra: " + mp[0] + "). Se há pendência, a aba não pode ficar OK e o cliente pode recusar; a aba precisa ser refeita.");
    }
    if (l.segKey === "ZELADORIA") {
      const restrito = /RESTRI|NAO OK/.test(semAcento(fatoAba).toUpperCase());
      if (restrito && RE_ZELADORIA.test(txt) && !(E.escal && E.escal.chamado)) a.push("Zeladoria com restrição por vegetação ou similar, sem chamado de escalonamento||Quando o motivo é mato alto, vegetação ou algo parecido, o técnico precisa abrir chamado de escalonamento com a detentora. A foto não prova isso, então a validadora confere e registra o número do chamado aqui no detalhe da aba; ele fica guardado para o site.");
    }
    // fotos
    const fotos = rep.fotos || [];
    const reps = fotos.map(function (f, i) { return f.repetida ? "foto " + (i + 1) + " igual à " + f.repetida : null; }).filter(Boolean);
    if (reps.length) a.push("Fotos repetidas no relatório (" + reps.join("; ") + ")||Duas fotos iguais no mesmo relatório indicam imagem reaproveitada; cada foto deve mostrar o equipamento naquele momento.");
    if (rep.ocrFeito) {
      const sem = fotos.filter(function (f) { return !f.carimbo; }).length;
      if (sem) a.push("Foto sem data e hora legível: " + sem + " de " + fotos.length + "||A data e a hora carimbadas na foto são obrigatórias. A leitura automática não achou o carimbo em " + sem + " foto(s); abra as fotos para ver se o carimbo realmente falta ou só está ilegível.");
      const fora = {};
      fotos.forEach(function (f) { if (f.carimbo && f.carimbo.data && f.carimbo.data.slice(0, 7) !== E.mes) fora[f.carimbo.data] = 1; });
      Object.keys(fora).forEach(function (d) { a.push("Foto com data " + dataBr(d) + " fora de " + nomeMes(E.mes) + "||A foto foi tirada fora do mês da preventiva; o cliente não aceita e a aba precisa ser refeita."); });
    }
    if (l.segKey === "ALARMES") {
      const bi = fotos.findIndex(function (f) { return /\bQIT\b/i.test(f.legenda); });
      if (bi < 0) { if (fotos.length) a.push("Foto dos bornes (QIT) não encontrada no relatório||O relatório de Alarmes deve ter uma foto com a legenda QIT (bornes) para conferir os jumps."); }
      else {
        const b = E.bornes[rep.arquivo];
        if (b && (b.resultado === "Tipo A" || b.resultado === "Tipo B" || b.resultado === "Suspeito")) a.push("Jump nos bornes: " + b.resultado + (b.comentario ? " (" + b.comentario + ")" : ""));
        if (b && b.resultado === "Ininteligível") a.push("Foto fora do Padrão: bornes ininteligíveis" + (b.comentario ? " (" + b.comentario + ")" : ""));
      }
    }
    // análise técnica
    if (rep.medicoes) analisarMedicoes(rep.medicoes).forEach(function (t) { a.push(t); });
    if (rep.leitura && leituraSuspeita(rep.leitura)) a.push("Leitura do medidor suspeita: " + rep.leitura + "||Números em sequência, repetidos ou curtos demais sugerem leitura digitada sem olhar o medidor; compare com a foto do medidor.");
    (rep.alarmes || []).forEach(function (it) { if (it.fim === "NÃO OK" || it.fim === "NAO OK") a.push("Alarme " + it.n + " - " + it.nome + ": final NÃO OK||O item terminou com NÃO OK no checklist de alarmes, ou seja, ficou alarme sem normalizar."); });
    return a;
  }

  function recalcular() {
    const esp = montarEsperado();
    const usados = {};
    esp.forEach(function (l) {
      let achou = null;
      E.pdfs.forEach(function (p) {
        if (achou || usados[p.arquivo] || p.segmento !== l.segKey) return;
        if (l.tag && p.tag && chaveTag(p.tag) === chaveTag(l.tag)) achou = p;
      });
      E.pdfs.forEach(function (p) {
        if (achou || usados[p.arquivo] || p.segmento !== l.segKey) return;
        if (!l.tag || !esp.some(function (o) { return o !== l && o.bloco === l.bloco && o.segKey === l.segKey && o.tag && p.tag && chaveTag(o.tag) === chaveTag(p.tag); })) achou = p;
      });
      if (achou) { usados[achou.arquivo] = true; l.rep = achou; }
    });
    esp.forEach(function (l) { l.dups = []; });
    const sobra = E.pdfs.filter(function (p) { return !usados[p.arquivo]; }).filter(function (p) {
      const dono = esp.filter(function (l) { return l.rep && l.segKey === p.segmento && chaveTag(l.rep.tag || l.tag) === chaveTag(p.tag); })[0];
      if (dono) { dono.dups.push(p); return false; }
      return true;
    });
    const extras = sobra.map(function (p) {
      const rg = regraDe(p.segmento);
      return { bloco: "Fora do Cronograma", tipoWo: null, wo: null, seg: rg ? rg.segmento : p.segmentoTxt, segKey: p.segmento, tag: p.tag, obrig: "—", doCrono: false, regra: rg, rep: p, extra: true };
    });
    const todas = esp.concat(extras);
    todas.forEach(function (l) { l.achados = analisarLinha(l); if (l.extra && l.rep && !l.regra) l.achados.push("Segmento " + (l.rep.segmentoTxt || "") + " não está no cadastro de segmentos"); l.refazer = l.achados.length > 0; });
    E.linhas = todas;
    desenhar();
  }

  // ==== TELA ===============================================================
  function marca(l) {

  }

      '<div><div class="n">' + nSem + '</div><div class="l">Sem PDF enviado</div></div>' +
      '<div><div class="n">' + nFalt + '</div><div class="l">Faltando</div></div>' +

    vis.forEach(function (l) { let b = blocos.filter(function (x) { return x.nome === l.bloco; })[0]; if (!b) { b = { nome: l.bloco, linhas: [] }; blocos.push(b); } b.linhas.push(l); });

        "<table><thead><tr><th>Segmento</th><th>Tag</th><th>Obrigatória</th><th>Arquivo</th><th>Resultado</th><th>Fato na validação</th><th>Status</th><th>Ticket</th><th>Alerta</th></tr></thead><tbody>" +
        b.linhas.map(function (l) {
          const i = E.linhas.indexOf(l), r = l.rep, v = l.val;
          const prov = r && ehProvisorio(r.ticket);
          const sub = !r;
          return '<tr class="clic" data-i="' + i + '"><td>' + esc(l.seg) + "</td><td>" + esc((r && r.tag) || l.tag || "—") + "</td><td>" + l.obrig + "</td>" +
            "<td" + (sub ? ' class="g"' : "") + ">" + (r ? esc(r.arquivo) + (l.dups && l.dups.length ? ' <span class="tag">+' + l.dups.length + " repetido</span>" : "") : "Sem relatório") + "</td><td>" + (r ? esc(r.situacaoFinal || "—") : "—") + "</td>" +
            "<td>" + (v ? esc(v.fato || "—") : "—") + "</td><td>" + (v ? esc(v.status || "—") : "—") + "</td>" +
            "<td>" + (r ? esc(r.ticket || "—") + (prov ? ' <span class="tag">Provisório</span>' : "") : "—") + "</td><td>" + marca(l) + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }).join("") : '<div class="g">Nenhuma aba para mostrar.</div>';
    $("ignorados").innerHTML = E.ignorados.length ? '<div class="bl"><h2>Arquivos ignorados<span class="g">' + E.ignorados.length + "</span></h2><table><tbody>" +
      E.ignorados.map(function (g) { return "<tr><td>" + esc(g.arquivo) + "</td><td>" + esc(g.motivo) + "</td></tr>"; }).join("") + "</tbody></table></div>" : "";
  }
  $("filtro").addEventListener("change", desenhar);
  $("blocos").addEventListener("click", function (e) {
    const tr = e.target.closest("tr[data-i]");
    if (tr) abrirDetalhe(E.linhas[Number(tr.getAttribute("data-i"))]);

  function comentarioHtml(r) {
    if (!r || (!r.comentario && !r.justificativa)) return "";
    return '<div class="msec"><h4>Comentário do técnico</h4>' + (r.comentario ? '<div class="cmt">' + esc(r.comentario) + "</div>" : "") + (r.justificativa ? '<div class="g" style="margin:6px 0 2px">Justificativa</div><div class="cmt">' + esc(r.justificativa) + "</div>" : "") + "</div>";
  }
  function restritoZel(l) {
    const r = l.rep, v = l.val;
    const f = semAcento(String((v && v.fato) || (r && r.situacaoFinal) || "")).toUpperCase();
    return l.segKey === "ZELADORIA" && /RESTRI|NAO OK/.test(f);
  }
  function escalHtml(l) {
    if (!l.rep || !restritoZel(l)) return "";
    const e = E.escal || {};
    return '<div class="msec" id="secEscal"><h4>Chamado de escalonamento com a detentora</h4>' +
      '<div class="linha"><div><div class="lab">Número do chamado <span class="laranja">*</span></div><input class="campo" id="eChamado" value="' + esc(e.chamado || "") + '"></div>' +
      '<div style="flex:1;min-width:240px"><div class="lab">Observação</div><input class="campo" id="eObs" style="width:100%" value="' + esc(e.observacao || "") + '"></div>' +
      '<button class="btn" id="eSalvar" disabled>Registrar chamado</button></div><div class="g" id="eMsg">' + (e.chamado ? "Registrado por " + esc(e.registrado_por || "") : "") + "</div></div>";
  }
  function ligarEscal(l) {
    if (!$("eSalvar")) return;
    function validar() { $("eSalvar").disabled = !$("eChamado").value.trim(); }
    $("eChamado").addEventListener("input", validar); validar();
    $("eSalvar").addEventListener("click", async function () {
      $("eSalvar").disabled = true; $("eMsg").textContent = "Gravando...";
      const row = { chave: E.siteChave + "|" + E.mes + "|zeladoria", site_chave: E.siteChave, mes: E.mes + "-01", motivo: (l.rep.comentario || "").slice(0, 300), chamado: $("eChamado").value.trim(), observacao: $("eObs").value.trim() || null, registrado_por: E.usuario, registrado_em: new Date().toISOString() };
      const g = await banco.from("escalonamentos").upsert(row, { onConflict: "chave" });
      if (g.error) { $("eMsg").innerHTML = '<span class="erro">Erro ao gravar: ' + esc(g.error.message) + "</span>"; $("eSalvar").disabled = false; return; }
      E.escal = row;
      $("eMsg").textContent = "Chamado registrado.";
      recalcular();
    });
  }
  function achHtml(t) {
    const q = String(t).split("||");
    return '<div class="ach"><div>' + esc(q[0]) + "</div>" + (q[1] ? '<div class="g" style="margin-top:4px">' + esc(q[1]) + "</div>" : "") + "</div>";
  }
  function medicoesHtml(r) {
    const m = r && r.medicoes;
    if (!m) return "";
    const rows = [["Tensão fase-neutro (V)", m.tensaoFN], ["Tensão fase-fase (V)", m.tensaoFF], ["Corrente (A)", m.corrente], ["Temperatura (ºC)", m.temp], ["Balanceamento", m.balanc],
      ["Tensão entrada AC (V)", m.acTensao], ["Corrente entrada AC (A)", m.acCorrente]].filter(function (x) { return x[1] && pres(x[1]).length; })
      .map(function (x) { return "<tr><td>" + x[0] + "</td><td>" + lista(x[1]) + "</td></tr>"; });
    if (m.potKw != null) rows.push("<tr><td>Potência</td><td>" + fmt(m.potKw) + " kW" + (m.potPct != null ? " (" + fmt(m.potPct) + "%)" : "") + "</td></tr>");
    if (m.dcV != null) rows.push("<tr><td>Saída DC</td><td>" + fmt(m.dcV) + " V" + (m.dcI != null ? " / " + fmt(m.dcI) + " A" : "") + "</td></tr>");
    if (r.leitura) rows.push("<tr><td>Leitura do medidor</td><td>" + esc(r.leitura) + "</td></tr>");
    if (!rows.length) return "";
    return '<div class="msec"><h4>Medições</h4><table class="tb"><tbody>' + rows.join("") + "</tbody></table></div>";
  }
  function fotosHtml(l) {
    const r = l.rep;
    if (!r || !r.fotos || !r.fotos.length) return "";
    const bi = l.segKey === "ALARMES" ? r.fotos.findIndex(function (f) { return /\bQIT\b/i.test(f.legenda); }) : -1;
    const cards = r.fotos.map(function (f, i) {
      const sel = [];
      if (f.repetida) sel.push('<span class="refazer">Igual à foto ' + f.repetida + "</span>");
      if (r.ocrFeito || f.carimbo !== null) sel.push(f.carimbo && f.carimbo.data ? dataBr(f.carimbo.data) + (f.carimbo.hora ? " " + esc(f.carimbo.hora) : "") : '<span class="refazer">Sem data e hora</span>');
      return '<div class="fto"><img src="' + f.url + '" alt=""><div>Foto ' + (i + 1) + (f.legenda ? " · " + esc(f.legenda) : "") + '</div><div class="g">' + sel.join(" · ") + "</div></div>";
    }).join("");
    return '<div class="msec"><h4>Fotos (' + r.fotos.length + ')</h4><div class="fotos">' + cards + "</div></div>" + (bi >= 0 ? bornesHtml(l, bi) : "");
  }
  const RESULT_BORNES = ["Sem jump", "Tipo A", "Tipo B", "Suspeito", "Ininteligível"];
  const DESC_BORNES = {
    "Sem jump": "Bornes com a ligação normal, sem ponte ou fio forçando o alarme.",
    "Tipo A": "Jump evidente: fio ou ponte ligando dois bornes de forma direta, mantendo o alarme desligado.",
    "Tipo B": "Jump possível: ligação fora do padrão (fio solto, emenda ou borne em curto) que pode estar escondendo um alarme.",
    "Suspeito": "Não dá para afirmar pela foto, mas faltam alarmes que deveriam aparecer ou algo não bate; a validadora investiga.",
    "Ininteligível": "A foto não permite avaliar (escura, tremida, longe ou fora de enquadramento); o técnico precisa refazer a foto."
  };
  function bornesHtml(l, bi) {
    const b = E.bornes[l.rep.arquivo] || {};
    return '<div class="msec" id="secBornes"><h4>Conferência dos bornes (QIT)</h4>' +
      '<div class="bcv"><canvas id="cvBornes"></canvas></div>' +
      '<div class="linha" style="margin-top:12px"><button class="btn2" id="bDesfazer">Desfazer círculo</button><button class="btn2" id="bLimpar">Limpar</button></div>' +
      '<div class="linha"><div><div class="lab">Resultado <span class="laranja">*</span></div><select class="campo" id="bRes"><option value=""></option>' + RESULT_BORNES.map(function (x) { return '<option' + (b.resultado === x ? " selected" : "") + ">" + x + "</option>"; }).join("") + "</select></div>" +
      '<div style="flex:1;min-width:260px"><div class="lab">Comentário <span class="laranja">*</span></div><input class="campo" id="bCom" style="width:100%" value="' + esc(b.comentario || "") + '"></div>' +
      '<button class="btn" id="bSalvar" disabled>Registrar conferência</button></div><div class="leg">' + RESULT_BORNES.map(function (x) { return "<div><b>" + x + "</b> · " + DESC_BORNES[x] + "</div>"; }).join("") + '</div><div class="g" id="bMsg" style="margin-top:8px">' + (b.gravado ? "Conferida por " + esc(b.por || "") : "") + "</div></div>";
  }
  function ligarBornes(l) {
    const cv = $("cvBornes");
    if (!cv) return;
    const r = l.rep, bi = r.fotos.findIndex(function (f) { return /\bQIT\b/i.test(f.legenda); });
    const b = E.bornes[r.arquivo] = E.bornes[r.arquivo] || {};
    b.circulos = b.circulos || [];
    let img = null, arr = null;
    function pintar(extra) {
      const x = cv.getContext("2d");
      x.drawImage(img, 0, 0, cv.width, cv.height);
      x.strokeStyle = "#da1e28"; x.lineWidth = Math.max(3, cv.width / 160);
      b.circulos.concat(extra ? [extra] : []).forEach(function (c) {
        x.beginPath(); x.ellipse((c.x0 + c.x1) / 2, (c.y0 + c.y1) / 2, Math.max(2, Math.abs(c.x1 - c.x0) / 2), Math.max(2, Math.abs(c.y1 - c.y0) / 2), 0, 0, Math.PI * 2); x.stroke();
      });
    }
    function validar() { $("bSalvar").disabled = !($("bRes").value && $("bCom").value.trim()); }
    carregarImg(r.fotos[bi].url).then(function (im) {
      img = im; cv.width = im.naturalWidth; cv.height = im.naturalHeight; pintar();
      function pos(e) { const rc = cv.getBoundingClientRect(); return { x: (e.clientX - rc.left) * cv.width / rc.width, y: (e.clientY - rc.top) * cv.height / rc.height }; }
      cv.addEventListener("pointerdown", function (e) { const p = pos(e); arr = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener("pointermove", function (e) { if (!arr) return; const p = pos(e); arr.x1 = p.x; arr.y1 = p.y; pintar(arr); });
      cv.addEventListener("pointerup", function () { if (arr && Math.abs(arr.x1 - arr.x0) > 8 && Math.abs(arr.y1 - arr.y0) > 8) b.circulos.push(arr); arr = null; pintar(); });
    });
    $("bDesfazer").addEventListener("click", function () { b.circulos.pop(); if (img) pintar(); });
    $("bLimpar").addEventListener("click", function () { b.circulos = []; if (img) pintar(); });
    $("bRes").addEventListener("change", validar);
    $("bCom").addEventListener("input", validar);
    validar();
    $("bSalvar").addEventListener("click", async function () {
      $("bSalvar").disabled = true; $("bMsg").textContent = "Gravando...";
      b.resultado = $("bRes").value; b.comentario = $("bCom").value.trim();
      const chave = [E.siteChave, E.mes, r.arquivo].join("|");
      let erro = null;
      try {
        const blob = await new Promise(function (ok) { cv.toBlob(ok, "image/jpeg", 0.85); });
        const caminho = E.siteChave + "/" + E.mes + "/" + r.arquivo + ".jpg";
        const up = await banco.storage.from("bornes").upload(caminho, blob, { upsert: true, contentType: "image/jpeg" });
        if (up.error) erro = up.error.message;
        else {
          const g = await banco.from("bornes_conferencia").upsert({ chave: chave, site_chave: E.siteChave, mes: E.mes + "-01", arquivo: r.arquivo, resultado: b.resultado, comentario: b.comentario, circulos: b.circulos, imagem_path: caminho, conferido_por: E.usuario, conferido_em: new Date().toISOString() }, { onConflict: "chave" });
          if (g.error) erro = g.error.message;
        }
      } catch (e) { erro = String(e.message || e); }
      if (erro) { $("bMsg").innerHTML = '<span class="erro">Erro ao gravar: ' + esc(erro) + "</span>"; $("bSalvar").disabled = false; return; }
      b.gravado = true; b.por = E.usuario;
      $("bMsg").textContent = "Conferência registrada.";
      recalcular();
    });
  }
  function abrirDetalhe(l) {
    const r = l.rep, v = l.val;
    function kv(k, val) { return '<div><div class="k">' + k + '</div><div class="v">' + (val == null || val === "" ? "—" : esc(val)) + "</div></div>"; }
    $("modCorpo").innerHTML = '<div class="mh"><div><h3>' + esc(l.seg) + (l.tag ? " – " + esc(l.tag) : "") + '</h3><div class="g" style="margin-top:4px">' + esc(E.siteTxt.toUpperCase()) + (r ? " · " + esc(r.arquivo) : " · Sem relatório") + '</div></div><button class="x" id="fecharModal">✕</button></div>' +
      '<div class="mkv">' + kv("WO", l.wo ? l.tipoWo + " · " + l.wo : "Fora do Cronograma") + kv("Ticket", r && r.ticket) + kv("Resultado no relatório", r && r.situacaoFinal) +
      kv("Fato na validação", v && v.fato) + kv("Status", v && v.status) + kv("Início na validação", v && dataBr(v.inicio)) + kv("Fim na validação", v && dataBr(v.fim)) +
      kv("No Cronograma", l.eq ? [l.eq.tag || "sem tag", "status " + (l.eq.status_eqpto || "—"), "prevent. " + (l.eq.situacao_prev || "—")].join(" · ") : (l.doCrono === false && l.bloco !== "Fora do Cronograma" ? "Não consta no Cronograma" : "")) +
      kv("Data e hora do relatório", r && r.dataInicio ? r.dataInicio + " " + r.horaInicio : "") + kv("Realizada por", r && r.realizadaPor) + "</div>" +
      comentarioHtml(r) + escalHtml(l) + medicoesHtml(r) + fotosHtml(l) +
      '<div class="msec"><h4>Achados (' + (l.faltando ? 1 : (l.achados || []).length) + ")</h4>" +
      (l.faltando ? '<div class="ach"><div>Aba obrigatória sem preenchimento no sistema do cliente</div><div class="g" style="margin-top:4px">O Cronograma pede esta aba para a WO, mas ela não consta na Validação do mês. Confira em "No Cronograma" se o equipamento realmente se aplica.</div></div>' : (l.achados || []).length ? l.achados.map(achHtml).join("") : '<div class="g">Nenhum achado.</div>') + "</div>";
    $("modal").classList.remove("oculto");
    $("fecharModal").addEventListener("click", function () { $("modal").classList.add("oculto"); });
    ligarBornes(l);
    ligarEscal(l);
  }
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) $("modal").classList.add("oculto"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("modal").classList.add("oculto"); });

  // ==== EXPORTAR E GRAVAR ==================================================
  $("botaoExcel").addEventListener("click", function () {
    const cab = ["Bloco", "Segmento", "Tag", "Obrigatória", "Arquivo", "Resultado", "Fato na validação", "Status", "Ticket", "Alerta", "Achados", "Comentário do técnico"];
    const linhas = E.linhas.map(function (l) {
      const r = l.rep, v = l.val;
      return [l.bloco, l.seg, (r && r.tag) || l.tag || "", l.obrig, r ? r.arquivo : "", r ? r.situacaoFinal : "", v ? v.fato : "", v ? v.status : "", r ? r.ticket : "",
        l.faltando ? "Faltando" : l.refazer ? "Refazer" : l.semPdf ? "Sem PDF" : "", l.faltando ? "Aba obrigatória sem preenchimento" : (l.achados || []).join(" | ").replace(/\|\|/g, " — "), r ? ((r.comentario || "") + (r.justificativa ? " | Justificativa: " + r.justificativa : "")) : ""];
    });
    const ws = XLSX.utils.aoa_to_sheet([cab].concat(linhas));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Relatórios");
    XLSX.writeFile(wb, "relatorios_" + E.siteChave + "_" + E.mes + ".xlsx");
  });

  $("botaoGravar").addEventListener("click", async function () {
    const lote = E.linhas.filter(function (l) { return l.rep; }).map(function (l) {
      const r = l.rep;
      const iso = dataIso(r.dataInicio);
      return {
        chave: [E.siteChave, E.mes, l.segKey, chaveTag(r.tag), r.arquivo].join("|"),
        site: E.siteTxt.toUpperCase(), site_chave: E.siteChave, mes: E.mes + "-01", segmento: l.seg, tag: r.tag || null, arquivo: r.arquivo,
        wo: l.wo || null, ticket: r.ticket || null, situacao_final: r.situacaoFinal || null,
        data_relatorio: iso ? iso + "T" + (r.horaInicio || "00:00:00") + "-03:00" : null,
        fotos_qtd: (r.fotos || []).length, achados: (l.achados || []).map(function (t) { return { texto: String(t).replace("||", " — ") }; }), refazer: !!l.refazer,
        analisado_por: E.usuario, analisado_em: new Date().toISOString()
      };
    });
    if (!lote.length) { $("msg").innerHTML = '<span class="erro">Não há relatórios lidos para gravar.</span>'; return; }
    $("botaoGravar").disabled = true;
    const r = await banco.from("relatorios_analise").upsert(lote, { onConflict: "chave" });
    $("botaoGravar").disabled = false;
    $("msg").innerHTML = r.error ? '<span class="erro">Erro ao gravar: ' + esc(r.error.message) + "</span>" : "Análise gravada: " + lote.length + " relatórios.";
  });

  window.__rel = { interpretarPagina1: interpretarPagina1, juntarLinhas: juntarLinhas, segDoPdf: segDoPdf, E: E, recalcular: recalcular };
  iniciar();
})();
</script>
</body>
</html>
